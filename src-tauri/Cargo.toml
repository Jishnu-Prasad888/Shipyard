[package]
name = "shipyard"
version = "1.0.1"
description = "Project Management made easy"
authors = ["Jishnu"]
edition = "2021"
default-run = "shipyard"

[workspace]
members = ["core"]

[lib]
name = "shipyard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shipyard-core = { path = "core" }
base64 = "0.22"
tokio = { version = "1", features = ["time", "fs"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screenshot"] }
percent-encoding = "2"
